<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestión de Necesidades</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
  <script src="https://cdn.jsdelivr.net/gh/securedoc-app/securedoc-libs@main/input-numerico/lib.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/securedoc-app/securedoc-libs@main/tasa-de-cambio/lib.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/securedoc-app/securedoc-libs@main/tabla-de-datos/lib.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/securedoc-app/securedoc-libs@main/leer-factura/lib.js"></script>
  <style>
    body { background:#f6f7f9; }
    .sidebar .btn { text-align:left; }
    .sidebar .btn.active { font-weight:600; }
    .card-metric .big { font-size:1.6rem; font-weight:700; }
    .nowrap { white-space:nowrap; }
    .text-small { font-size:.85rem; }
    main { min-height:70vh; }
    .line-grid { font-size:.9rem; }
    @media print {
      .navbar, .sidebar, .no-print { display:none !important; }
      .col-md-9, .col-lg-10 { width:100% !important; max-width:100% !important; flex:0 0 100% !important; }
      main { box-shadow:none !important; padding:0 !important; }
      body { background:#fff; }
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Gestión de Necesidades</span>
      <span id="ctxBadge" class="text-light text-small"></span>
    </div>
  </nav>
  <div class="container-fluid py-3">
    <div id="globalAlert"></div>
    <div class="row g-3">
      <div class="col-12 col-md-3 col-lg-2">
        <div id="sidebar" class="sidebar d-grid gap-1"></div>
      </div>
      <div class="col-12 col-md-9 col-lg-10">
        <main id="content" class="bg-white rounded shadow-sm p-3"></main>
      </div>
    </div>
  </div>

  <script>
  var APP = { ctx:null, view:"Tablero", cache:{}, detalleInsumoId:null, invInsumoId:null, facturaDraft:null, repMes:"ALL", listaCompras:null };
  var ENTIDADES = ["Categoria","Insumo","Servicio","Proveedor","Factura","LineaFactura","InventarioFisico"];
  var MENU = ["Tablero","Categorías","Insumos","Plan de Consumo","Servicios","Proveedores","Registrar Factura","Inventario Físico","Lista de Compras","Reportes"];

  if (typeof SecureDoc === "undefined") {
    document.getElementById("content").textContent = "No se detectó el entorno SecureDoc. Abra esta aplicación dentro de SecureDoc.";
  } else {
    SecureDoc.ready(function(ctx){
      APP.ctx = ctx || {};
      boot();

      // ---------- Helpers DOM ----------
      function el(tag, attrs, children){
        var n = document.createElement(tag);
        if (attrs){
          Object.keys(attrs).forEach(function(k){
            if (k === "class") n.className = attrs[k];
            else if (k === "text") n.textContent = attrs[k];
            else if (k === "html") { /* nunca usamos html dinámico */ }
            else if (k in n && k !== "list") { try { n[k] = attrs[k]; } catch(e){ n.setAttribute(k, attrs[k]); } }
            else n.setAttribute(k, attrs[k]);
          });
        }
        (children||[]).forEach(function(c){
          if (c == null) return;
          n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
        });
        return n;
      }
      function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
      function byId(id){ return document.getElementById(id); }

      // ---------- Formato / fechas ----------
      var nfUSD = new Intl.NumberFormat("es-VE", { minimumFractionDigits:2, maximumFractionDigits:2 });
      var nf2 = new Intl.NumberFormat("es-VE", { minimumFractionDigits:0, maximumFractionDigits:2 });
      function money(n){ n = Number(n); if(!isFinite(n)) n = 0; return "$ " + nfUSD.format(n); }
      function num2(n){ n = Number(n); if(!isFinite(n)) n = 0; return nf2.format(n); }
      function todayISO(){ var d = new Date(); return isoFromDate(d); }
      function isoFromDate(d){
        var m = String(d.getMonth()+1).padStart(2,"0");
        var day = String(d.getDate()).padStart(2,"0");
        return d.getFullYear() + "-" + m + "-" + day;
      }
      function parseLocal(iso){
        if(!iso) return null;
        var p = String(iso).slice(0,10).split("-");
        if(p.length < 3) return null;
        return new Date(Number(p[0]), Number(p[1])-1, Number(p[2]));
      }
      function daysBetween(aIso, bIso){
        var a = parseLocal(aIso), b = parseLocal(bIso);
        if(!a || !b) return 0;
        return Math.round((b - a) / 86400000);
      }
      function addDaysISO(iso, days){
        var d = parseLocal(iso) || new Date();
        d.setDate(d.getDate() + Math.round(days));
        return isoFromDate(d);
      }
      function monthKey(iso){ return String(iso||"").slice(0,7); }

      // ---------- Avisos ----------
      function flash(msg, type){
        var cont = byId("globalAlert");
        clear(cont);
        var a = el("div", { class:"alert alert-"+(type||"info")+" alert-dismissible", role:"alert" }, [ String(msg) ]);
        var b = el("button", { class:"btn-close", type:"button" });
        b.setAttribute("data-bs-dismiss", "alert");
        a.appendChild(b);
        cont.appendChild(a);
        if ((type||"info") === "success") setTimeout(function(){ if(a.parentNode) a.parentNode.removeChild(a); }, 4000);
      }
      function showError(e){
        var msg = e && e.message ? e.message : (typeof e === "string" ? e : "Ocurrió un error inesperado.");
        flash(msg, "danger");
      }
      function readOnly(){ return !!(APP.ctx && APP.ctx.readOnly); }

      // ---------- Acceso a datos (SecureDoc) ----------
      function sdList(entidad){
        return SecureDoc.data.list({ where:[["entidad","==",entidad]], limit:500 })
          .then(function(rows){ return rows || []; });
      }
      function sdAdd(entidad, obj){
        obj = obj || {}; obj.entidad = entidad;
        return SecureDoc.data.add(obj);
      }
      function sdUpdate(id, patch){ return SecureDoc.data.update(id, patch); }
      function sdRemove(id){ return SecureDoc.data.remove(id); }

      // ---------- Store (una sola carga por entidad, recarga tras escribir) ----------
      function loadEntidad(entidad){
        return sdList(entidad).then(function(rows){ APP.cache[entidad] = rows; return rows; });
      }
      function loadAll(){
        return Promise.all(ENTIDADES.map(loadEntidad)).then(function(){ return APP.cache; });
      }
      function get(entidad){ return (APP.cache[entidad] || []).slice(); }
      function findById(entidad, id){
        var arr = APP.cache[entidad] || [];
        for (var i=0;i<arr.length;i++){ if(arr[i].id === id) return arr[i]; }
        return null;
      }
      function nombreCategoria(id){ var c = findById("Categoria", id); return c ? c.nombre : ""; }
      function nombreRef(entidad, id){ var r = findById(entidad, id); return r ? r.nombre : ""; }

      // ---------- Boot / navegación ----------
      function boot(){
        var badge = byId("ctxBadge");
        badge.textContent = readOnly() ? "Modo solo lectura" : "";
        buildSidebar();
        byId("content").textContent = "Cargando datos…";
        loadAll().then(function(){ render(); }).catch(function(e){
          byId("content").textContent = "";
          showError(e);
        });
      }
      function buildSidebar(){
        var sb = byId("sidebar"); clear(sb);
        MENU.forEach(function(label){
          var b = el("button", { class:"btn btn-outline-primary" + (APP.view===label?" active":""), type:"button" }, [ label ]);
          b.addEventListener("click", function(){ APP.view = label; APP.detalleInsumoId = null; APP.invInsumoId = null; APP.facturaDraft = null; APP.listaCompras = null; buildSidebar(); render(); });
          sb.appendChild(b);
        });
      }
      function render(){
        var c = byId("content"); clear(c);
        try {
          if (APP.detalleInsumoId){ viewDetalleInsumo(c); return; }
          switch(APP.view){
            case "Tablero": viewTablero(c); break;
            case "Categorías": viewCategorias(c); break;
            case "Insumos": viewInsumos(c); break;
            case "Plan de Consumo": viewPlanSemanal(c); break;
            case "Servicios": viewServicios(c); break;
            case "Proveedores": viewProveedores(c); break;
            case "Registrar Factura": viewFactura(c); break;
            case "Inventario Físico": viewInventario(c); break;
            case "Lista de Compras": viewListaCompras(c); break;
            case "Reportes": viewReportes(c); break;
            default: viewTablero(c);
          }
        } catch(e){ showError(e); }
      }
      function refresh(entidades){
        var list = entidades || ENTIDADES;
        return Promise.all(list.map(loadEntidad)).then(function(){ render(); });
      }
      function h(c, texto, extra){
        var head = el("div", { class:"d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2" }, [
          el("h4", { class:"mb-0" }, [ texto ])
        ]);
        if (extra) head.appendChild(extra);
        c.appendChild(head);
      }

      // ---------- Cálculos de insumo ----------
      function calcInsumo(ins){
        var cd = Number(ins.consumoDiario) || 0;
        var ex = Number(ins.existencia) || 0;
        var dias = cd > 0 ? ex / cd : null;
        var transc = ins.fechaUltimoInventario ? daysBetween(ins.fechaUltimoInventario, todayISO()) : 0;
        if (transc < 0) transc = 0;
        var proy = ex - (transc * cd);
        if (!isFinite(proy)) proy = ex;
        // Costo mensual = (costo USD de la última compra × consumo diario × 30) / cantidad de la última compra.
        var ultCompraUSD = Number(ins.ultCompraCostoUSD);
        var ultCompraCant = Number(ins.ultCompraCantidad);
        var costoMes;
        if (isFinite(ultCompraUSD) && isFinite(ultCompraCant) && ultCompraCant > 0){
          costoMes = (ultCompraUSD * cd * 30) / ultCompraCant;
        } else {
          // Compatibilidad con insumos previos: usa el último costo unitario.
          costoMes = cd * 30 * (Number(ins.ultimoCostoUSD) || 0);
        }
        if (!isFinite(costoMes)) costoMes = 0;
        var fechaAgote = (cd > 0) ? addDaysISO(todayISO(), Math.max(0, proy / cd)) : null;
        var diasProy = cd > 0 ? proy / cd : null;
        var minDias = Number(ins.stockMinimoDias) || 0;
        var cicloDias = Number(ins.diasCompra) || 0;
        var objetivo = cd * (cicloDias + minDias);
        var sugerida = Math.max(0, Math.ceil(objetivo - proy));
        if (!isFinite(sugerida)) sugerida = 0;
        return { diasExistencia: dias, existenciaProyectada: proy, diasProyectados: diasProy, consumoMensual: cd * 30, costoMesUSD: costoMes, fechaAgote: fechaAgote, cantidadSugerida: sugerida, transcurridos: transc };
      }
      function enAlerta(ins){
        var cc = calcInsumo(ins);
        var minDias = Number(ins.stockMinimoDias) || 0;
        if (cc.diasProyectados != null && cc.diasProyectados <= minDias) return true;
        return false;
      }

      // ---------- Plan de consumo (tomas) ----------
      // Momentos del día, en orden, con una hora de referencia para ordenar/comparar.
      var MOMENTOS = [
        { k:"ayunas",         t:"En ayunas / al despertar",   h:"06:30" },
        { k:"antes_desayuno", t:"Antes del desayuno",          h:"07:00" },
        { k:"desayuno",       t:"Con / después del desayuno",   h:"08:00" },
        { k:"media_manana",   t:"Media mañana",                h:"10:30" },
        { k:"antes_almuerzo", t:"Antes del almuerzo",          h:"12:00" },
        { k:"almuerzo",       t:"Con / después del almuerzo",   h:"13:00" },
        { k:"merienda",       t:"Media tarde / merienda",       h:"16:00" },
        { k:"antes_cena",     t:"Antes de la cena",             h:"19:00" },
        { k:"cena",           t:"Con / después de la cena",      h:"20:00" },
        { k:"dormir",         t:"Antes de dormir",              h:"22:00" }
      ];
      // Días de la semana (getDay: 0=domingo..6=sábado), mostrados de lunes a domingo.
      var DIAS_SEMANA = [ {k:1,t:"Lun"},{k:2,t:"Mar"},{k:3,t:"Mié"},{k:4,t:"Jue"},{k:5,t:"Vie"},{k:6,t:"Sáb"},{k:0,t:"Dom"} ];
      function momentoDef(k){ for(var i=0;i<MOMENTOS.length;i++){ if(MOMENTOS[i].k===k) return MOMENTOS[i]; } return null; }
      function momentoOrden(k){ for(var i=0;i<MOMENTOS.length;i++){ if(MOMENTOS[i].k===k) return i; } return 99; }
      function momentoLabel(k){ var d=momentoDef(k); return d?d.t:(k||""); }
      function horaValida(h){ return /^\d{2}:\d{2}$/.test(String(h||"")); }
      function minutosDe(hhmm){ var p=String(hhmm||"").split(":"); return (Number(p[0])||0)*60+(Number(p[1])||0); }
      // Hora de referencia de una toma: su hora exacta si la tiene, si no la del momento.
      function tomaHoraRef(toma){ if(horaValida(toma&&toma.hora)) return toma.hora; var d=momentoDef(toma&&toma.momento); return d?d.h:"12:00"; }
      function nuevaToma(){ return { momento:"desayuno", hora:"", cantidad:1, diasTipo:"todos", diasSemana:[1,2,3,4,5,6,0], cadaN:1, inicio:todayISO(), finTipo:"indefinido", finFecha:"", finDias:0, nota:"" }; }
      function planDe(ins){ return (ins && Array.isArray(ins.plan)) ? ins.plan : []; }
      function clonarPlan(plan){ try { return JSON.parse(JSON.stringify(plan||[])); } catch(e){ return []; } }
      // Fecha de fin efectiva de una toma (ISO) o null si es indefinida.
      function tomaFinISO(toma){
        if(toma.finTipo==="hasta") return toma.finFecha||null;
        if(toma.finTipo==="porN"){ var n=Number(toma.finDias)||0; if(n<=0) return null; return addDaysISO(toma.inicio||todayISO(), n-1); }
        return null;
      }
      // ¿La toma está vigente en la fecha dada? (dentro de su ventana inicio..fin)
      function tomaVigente(toma, iso){
        var ini = toma.inicio||todayISO();
        if (daysBetween(ini, iso) < 0) return false;
        var fin = tomaFinISO(toma);
        if (fin && daysBetween(iso, fin) < 0) return false;
        return true;
      }
      // ¿La toma aplica (toca) en la fecha dada según su pauta de días?
      function tomaAplicaDia(toma, iso){
        if(!tomaVigente(toma,iso)) return false;
        if(toma.diasTipo==="todos") return true;
        if(toma.diasTipo==="semana"){ var dd=parseLocal(iso); if(!dd) return false; return (toma.diasSemana||[]).indexOf(dd.getDay())>=0; }
        if(toma.diasTipo==="cadaN"){ var n=Number(toma.cadaN)||1; if(n<1) n=1; var diff=daysBetween(toma.inicio||iso, iso); return diff>=0 && (diff % n)===0; }
        return false;
      }
      // Fracción de días en que la toma aplica (para promediar el consumo diario).
      function tomaFactorDiario(toma){
        if(toma.diasTipo==="todos") return 1;
        if(toma.diasTipo==="semana") return (toma.diasSemana||[]).length/7;
        if(toma.diasTipo==="cadaN"){ var n=Number(toma.cadaN)||1; if(n<1) n=1; return 1/n; }
        return 0;
      }
      // Consumo diario promedio derivado del plan (solo tomas vigentes hoy).
      function consumoDiarioDesdePlan(plan, iso){
        iso = iso||todayISO();
        var tot=0;
        (plan||[]).forEach(function(t){ if(tomaVigente(t,iso)) tot += (Number(t.cantidad)||0)*tomaFactorDiario(t); });
        if(!isFinite(tot)||tot<0) tot=0;
        return tot;
      }
      // Resumen corto de una toma para listados.
      function resumenToma(toma, unidad){
        var dias = toma.diasTipo==="todos" ? "todos los días"
          : (toma.diasTipo==="semana" ? DIAS_SEMANA.filter(function(d){ return (toma.diasSemana||[]).indexOf(d.k)>=0; }).map(function(d){ return d.t; }).join(" ")
          : ("cada "+(Number(toma.cadaN)||1)+" d\u00edas"));
        var hr = horaValida(toma.hora) ? (" ("+toma.hora+")") : "";
        return num2(Number(toma.cantidad)||0)+" "+(unidad||"u")+" · "+momentoLabel(toma.momento)+hr+" · "+dias;
      }

      // ---------- Form helpers ----------
      function campo(labelText, inputNode){
        return el("div", { class:"mb-3" }, [
          el("label", { class:"form-label" }, [ labelText ]),
          inputNode
        ]);
      }
      function inputText(id, value, attrs){
        var i = el("input", Object.assign({ id:id, type:"text", class:"form-control", value: value||"" }, attrs||{}));
        return i;
      }
      function inputFecha(id, value){
        return el("input", { id:id, type:"date", class:"form-control", value: value || todayISO() });
      }
      function selectField(id, options, value){
        var s = el("select", { id:id, class:"form-select" });
        options.forEach(function(o){
          var val = (typeof o === "object") ? o.value : o;
          var txt = (typeof o === "object") ? o.label : o;
          var op = el("option", { value: val }, [ txt ]);
          if (val === value) op.selected = true;
          s.appendChild(op);
        });
        return s;
      }
      function inputNumero(id, value, opts){
        opts = opts || {};
        var n = document.createElement("input-numero");
        n.id = id;
        n.setAttribute("decimals", opts.decimals != null ? opts.decimals : 2);
        if (opts.min != null) n.setAttribute("min", opts.min);
        if (opts.allowNegatives === false) n.setAttribute("allow-negatives", "false");
        if (value != null && value !== "") n.setAttribute("value", value);
        return n;
      }
      function readNumero(id){
        var n = byId(id);
        if (!n) return 0;
        if (n.tagName && n.tagName.toLowerCase() === "input-numero") {
          var v = n.value; return (v==null || isNaN(Number(v))) ? 0 : Number(v);
        }
        return Number(n.value) || 0;
      }
      function readVal(id){ var n = byId(id); return n ? n.value : ""; }

      // ---------- Tabla de datos ----------
      function mountTable(container, columns, data, alClicFila, opts){
        opts = opts || {};
        var t = document.createElement("data-table");
        t.setAttribute("sortable", "");
        t.setAttribute("filterable", "");
        t.setAttribute("paginate", "");
        t.setAttribute("page-size", String(opts.pageSize || 15));
        if (opts.exportable !== false) t.setAttribute("exportable", "");
        container.appendChild(t);
        t.columns = columns;
        t.data = data;
        if (alClicFila) t.addEventListener("row-click", function(ev){
          var d = ev && ev.detail ? ev.detail : {};
          var row = d.row || d.item || d.data || d;
          alClicFila(row);
        });
        return t;
      }

      // ================= CATEGORÍAS =================
      function viewCategorias(c){
        var btn = el("button", { class:"btn btn-primary", type:"button" }, [ "+ Nueva categoría" ]);
        btn.disabled = readOnly();
        btn.addEventListener("click", function(){ formCategoria(null); });
        h(c, "Categorías", btn);

        var rows = get("Categoria").map(function(x){
          return { id:x.id, Nombre:x.nombre, Naturaleza:x.naturaleza, Descripción:x.descripcion||"", Activa: x.activa===false?"No":"Sí" };
        }).sort(function(a,b){ return (a.Naturaleza+a.Nombre).localeCompare(b.Naturaleza+b.Nombre); });
        var cols = [ {key:"Nombre",label:"Nombre"},{key:"Naturaleza",label:"Naturaleza"},{key:"Descripción",label:"Descripción"},{key:"Activa",label:"Activa"} ];
        if (!rows.length){ c.appendChild(el("p",{class:"text-muted"},["Aún no hay categorías. Crea la primera."])); return; }
        mountTable(c, cols, rows, function(row){ var cat = findById("Categoria", row.id); if(cat) formCategoria(cat); });
      }
      function formCategoria(cat){
        var c = byId("content"); clear(c);
        var editando = !!cat;
        h(c, editando ? "Editar categoría" : "Nueva categoría");
        var frm = el("div", { class:"col-12 col-lg-6" });
        frm.appendChild(campo("Nombre", inputText("catNombre", cat?cat.nombre:"")));
        frm.appendChild(campo("Naturaleza", selectField("catNat", ["Insumo","Servicio"], cat?cat.naturaleza:"Insumo")));
        frm.appendChild(campo("Descripción", inputText("catDesc", cat?cat.descripcion:"")));
        frm.appendChild(campo("Estado", selectField("catAct", [{value:"si",label:"Activa"},{value:"no",label:"Inactiva"}], (cat && cat.activa===false)?"no":"si")));
        var acciones = el("div", { class:"d-flex gap-2" });
        var save = el("button",{class:"btn btn-success",type:"button"},["Guardar"]);
        save.disabled = readOnly();
        save.addEventListener("click", function(){
          var nombre = readVal("catNombre").trim();
          if (!nombre){ flash("El nombre es obligatorio.","warning"); return; }
          var patch = { nombre:nombre, naturaleza:readVal("catNat"), descripcion:readVal("catDesc").trim(), activa: readVal("catAct")==="si" };
          var p = editando ? sdUpdate(cat.id, patch) : sdAdd("Categoria", patch);
          save.disabled = true;
          p.then(function(){ flash("Categoría guardada.","success"); return refresh(["Categoria"]); })
           .catch(function(e){ save.disabled=false; showError(e); });
        });
        var cancel = el("button",{class:"btn btn-outline-secondary",type:"button"},["Volver"]);
        cancel.addEventListener("click", function(){ render(); });
        acciones.appendChild(save); acciones.appendChild(cancel);
        if (editando && !readOnly()){
          var del = el("button",{class:"btn btn-outline-danger ms-auto",type:"button"},["Eliminar"]);
          del.addEventListener("click", function(){
            if (!confirm("¿Eliminar esta categoría?")) return;
            sdRemove(cat.id).then(function(){ flash("Categoría eliminada.","success"); return refresh(["Categoria"]); }).catch(showError);
          });
          acciones.appendChild(del);
        }
        frm.appendChild(acciones);
        c.appendChild(frm);
      }

      // ================= INSUMOS =================
      function viewInsumos(c){
        var btn = el("button",{class:"btn btn-primary",type:"button"},["+ Nuevo insumo"]);
        btn.disabled = readOnly();
        btn.addEventListener("click", function(){ formInsumo(null); });
        h(c, "Insumos", btn);
        var rows = get("Insumo").map(function(x){
          var cc = calcInsumo(x);
          return { id:x.id, Nombre:x.nombre, Unidad:x.unidad||"", Categoría:nombreCategoria(x.categoria),
            Existencia:num2(x.existencia), ConsumoDiario:num2(x.consumoDiario),
            Días: cc.diasExistencia==null?"—":num2(cc.diasExistencia),

      // ================= PLAN DE CONSUMO (SEMANAL) =================
      function lunesDeSemana(iso){
        var d = parseLocal(iso) || new Date();
        var dow = d.getDay(); // 0=dom..6=sab
        var diff = (dow===0) ? -6 : (1 - dow); // retroceder al lunes
        return addDaysISO(iso, diff);
      }
      function viewPlanSemanal(c){
        if (typeof APP.planWeekOffset !== "number") APP.planWeekOffset = 0;
        var hoy = todayISO();
        var lunesBase = lunesDeSemana(hoy);
        var lunes = addDaysISO(lunesBase, APP.planWeekOffset*7);
        var domingo = addDaysISO(lunes, 6);
        // Insumos con plan
        var insumos = get("Insumo").filter(function(x){ return x.llevaPlan && planDe(x).length; });
        // Controles de navegación
        var nav = el("div",{class:"btn-group"});
        var bPrev = el("button",{class:"btn btn-outline-secondary btn-sm",type:"button"},["← Semana anterior"]);
        bPrev.addEventListener("click", function(){ APP.planWeekOffset -= 1; render(); });
        var bHoy = el("button",{class:"btn btn-outline-secondary btn-sm",type:"button"},["Hoy"]);
        bHoy.addEventListener("click", function(){ APP.planWeekOffset = 0; render(); });
        var bNext = el("button",{class:"btn btn-outline-secondary btn-sm",type:"button"},["Semana siguiente →"]);
        bNext.addEventListener("click", function(){ APP.planWeekOffset += 1; render(); });
        nav.appendChild(bPrev); nav.appendChild(bHoy); nav.appendChild(bNext);
        h(c, "Plan de Consumo", nav);
        c.appendChild(el("p",{class:"text-small text-muted"},["Semana del "+lunes+" al "+domingo+". Vista informativa de las tomas programadas de tus insumos con plan."]));
        if(!insumos.length){ c.appendChild(el("div",{class:"alert alert-info"},["A\u00fan no hay insumos con un plan de consumo. Activa un plan al editar un insumo (p. ej. medicinas)."])); return; }
        // Determinar los momentos que aparecen en la semana
        var usados = {};
        var dias = [];
        for(var i=0;i<7;i++){ dias.push(addDaysISO(lunes, i)); }
        insumos.forEach(function(ins){
          planDe(ins).forEach(function(t){
            dias.forEach(function(diso){ if(tomaAplicaDia(t, diso)) usados[t.momento]=true; });
          });
        });
        var momentosLista = MOMENTOS.filter(function(m){ return usados[m.k]; });
        if(!momentosLista.length){ c.appendChild(el("div",{class:"alert alert-info"},["No hay tomas programadas en esta semana."])); return; }
        // Tabla rejilla momentos x días
        var wrap = el("div",{class:"table-responsive"});
        var tbl = el("table",{class:"table table-bordered align-middle text-small"});
        var thead = el("thead");
        var trh = el("tr");
        trh.appendChild(el("th",{class:"bg-light"},["Momento"]));
        DIAS_SEMANA.forEach(function(dw, i){
          var diso = dias[i];
          var esHoy = (diso===hoy);
          var th = el("th",{class:(esHoy?"bg-primary text-white":"bg-light")+" text-center"});
          th.appendChild(el("div",{},[dw.t]));
          th.appendChild(el("div",{class:"text-small fw-normal"},[diso.slice(5)]));
          trh.appendChild(th);
        });
        thead.appendChild(trh); tbl.appendChild(thead);
        var tbody = el("tbody");
        momentosLista.forEach(function(m){
          var tr = el("tr");
          var tdM = el("th",{class:"bg-light"});
          tdM.appendChild(el("div",{},[m.t]));
          tdM.appendChild(el("div",{class:"text-small fw-normal text-muted"},[m.h]));
          tr.appendChild(tdM);
          DIAS_SEMANA.forEach(function(dw, i){
            var diso = dias[i];
            var td = el("td",{class:(diso===hoy?"table-primary":"")});
            var items = [];
            insumos.forEach(function(ins){
              planDe(ins).forEach(function(t){
                if(t.momento===m.k && tomaAplicaDia(t, diso)){
                  var hr = horaValida(t.hora) ? (" "+t.hora) : "";
                  items.push(num2(Number(t.cantidad)||0)+" "+(ins.unidad||"u")+" · "+ins.nombre+hr+(t.nota?(" ("+t.nota+")"):""));
                }
              });
            });
            if(items.length){
              items.forEach(function(txt){ td.appendChild(el("div",{class:"mb-1"},[txt])); });
            } else {
              td.appendChild(el("span",{class:"text-muted"},["–"]));
            }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
        tbl.appendChild(tbody); wrap.appendChild(tbl); c.appendChild(wrap);
      }

      // ================= FACTURA (registrar compra/servicio) =================
      function nuevaLinea(){ return { refId:"", nuevoNombre:"", unidad:"", cantidad:1, montoOriginal:0, descOriginal:"", recordarAlias:false }; }
      function initFacturaDraft(){
        APP.facturaDraft = { fecha:todayISO(), proveedor:"", naturaleza:"Insumo", moneda:"Bs",
          tasaDolar:0, tasaEuro:0, tasaFecha:"", tasaDiasRetro:0, tasaMsg:"",
          montoTotalFactura:0, ajusteNeto:0, prorratear:true,
          modo:"Manual", lineas:[ nuevaLinea() ] };
      }
      function tasaNeeded(moneda){ return moneda==="Bs" || moneda==="EUR"; }
      function obtenerTasasFactura(cb){
        var d = APP.facturaDraft;
        if (typeof TasaCambio==="undefined" || !tasaNeeded(d.moneda)){ d.tasaMsg = tasaNeeded(d.moneda)?"Librería de tasa no disponible.":""; cb(); return; }
        var tasks = [ TasaCambio.obtener(d.fecha, "dolar oficial") ];
        if (d.moneda==="EUR") tasks.push(TasaCambio.obtener(d.fecha, "euro oficial"));
        Promise.all(tasks).then(function(res){
          d.tasaDolar = res[0] && res[0].tasa ? res[0].tasa : 0;
          d.tasaFecha = res[0] && res[0].fecha ? res[0].fecha : d.fecha;
          d.tasaDiasRetro = res[0] && res[0].diasRetrocedidos ? res[0].diasRetrocedidos : 0;
          if (d.moneda==="EUR") d.tasaEuro = res[1] && res[1].tasa ? res[1].tasa : 0;
          d.tasaMsg = "";
          cb();
        }).catch(function(e){
          d.tasaDolar = 0; d.tasaEuro = 0;
          d.tasaMsg = (e && /No se puede consultar este servicio/.test(String(e&&e.message||e))) ? "No se puede consultar este servicio desde una página web." : "No se pudo obtener la tasa; ingrésala manualmente.";
          cb();
        });
      }
      function lineaAUSD(montoFinalMoneda){
        var d = APP.facturaDraft;
        if (d.moneda==="USD") return montoFinalMoneda;
        if (d.moneda==="Bs") return d.tasaDolar ? (montoFinalMoneda / d.tasaDolar) : 0;
        if (d.moneda==="EUR") return d.tasaDolar ? (montoFinalMoneda * d.tasaEuro / d.tasaDolar) : 0;
        return montoFinalMoneda;
      }
      function viewFactura(c){
        if (!APP.facturaDraft) initFacturaDraft();
        h(c, "Registrar factura");
        var wrap = el("div", { id:"facturaWrap" });
        c.appendChild(wrap);
        renderFactura();
        // Al entrar, establecer la tasa para la fecha/moneda actuales si aún no se ha obtenido
        // (USD = 1; Bs/EUR = tasa oficial). El usuario siempre puede modificarla luego.
        var d = APP.facturaDraft;
        if (!d.tasaDolar && !d.tasaMsg) recargarTasa();
      }

      // Normaliza un nombre para comparar (minúsculas, sin tildes, espacios colapsados).
      function normNombre(s){
        s = String(s==null?"":s).toLowerCase().trim();
        try { s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, ""); } catch(e){}
        return s.replace(/\s+/g," ");
      }
      // Lista de alias (otros nombres/marcas) de un insumo, saneada.
      function aliasList(ins){
        if (!ins || !Array.isArray(ins.alias)) return [];
        return ins.alias.map(function(a){ return String(a||"").trim(); }).filter(Boolean);
      }
      // Busca un insumo por su nombre canónico o por cualquiera de sus alias.
      function buscarInsumoPorNombre(txt){
        var n = normNombre(txt); if (!n) return null;
        var lista = get("Insumo"), i, ins, al, j;
        for (i=0;i<lista.length;i++){ ins=lista[i]; if (normNombre(ins.nombre)===n) return ins; }
        for (i=0;i<lista.length;i++){ ins=lista[i]; al=aliasList(ins); for(j=0;j<al.length;j++){ if(normNombre(al[j])===n) return ins; } }
        return null;
      }
      // Busca un servicio por su nombre canónico.
      function buscarServicioPorNombre(txt){
        var n = normNombre(txt); if (!n) return null;
        var lista = get("Servicio"), i;
        for (i=0;i<lista.length;i++){ if (normNombre(lista[i].nombre)===n) return lista[i]; }
        return null;
      }
      function refOptions(naturaleza){
        var ent = naturaleza==="Servicio" ? "Servicio" : "Insumo";
        var opts = get(ent).map(function(x){
          var lbl = x.nombre;
          if (ent==="Insumo" && x.esGeneral) lbl += "  · general";
          return { value:x.id, label:lbl };
        }).sort(function(a,b){ return a.label.localeCompare(b.label); });
        opts.unshift({ value:"__nuevo__", label:"➕ Crear nuevo…" });
        opts.unshift({ value:"", label:"(selecciona)" });
        return opts;
      }
      function sumaOriginales(){
        return APP.facturaDraft.lineas.reduce(function(s,l){ return s + (Number(l.montoOriginal)||0); }, 0);
      }
      // Ajuste neto = (monto total de la factura) - (suma de los montos de los ítems).
      function recomputarAjuste(){
        var d = APP.facturaDraft;
        d.ajusteNeto = (Number(d.montoTotalFactura)||0) - sumaOriginales();
      }
      // Ajuste prorrateado para una línea (0 si el prorrateo está desactivado).
      function ajusteLineaDe(l){
        var d = APP.facturaDraft;
        if (!d.prorratear) return 0;
        var base = sumaOriginales();
        var w = base ? (Number(l.montoOriginal)||0)/base : 0;
        return (Number(d.ajusteNeto)||0) * w;
      }
      function netoLinea(l){ return (Number(l.montoOriginal)||0) + ajusteLineaDe(l); }
      function totalesFactura(){
        var d = APP.facturaDraft;
        var base = sumaOriginales();
        var ajuste = d.prorratear ? (Number(d.ajusteNeto)||0) : 0;
        var final = base + ajuste;
        return { base:base, ajuste:ajuste, final:final, finalUSD: lineaAUSD(final) };
      }
      function renderFactura(){
        var wrap = byId("facturaWrap"); if(!wrap) return; clear(wrap);
        var d = APP.facturaDraft;
        if (readOnly()){ wrap.appendChild(el("div",{class:"alert alert-info"},["Modo solo lectura: no puedes registrar facturas."])); return; }

        // ---- 1. Modo de ingreso (tres botones) + panel de ayuda ----
        renderModoFactura(wrap);
        if (d.modo==="IA") renderModoIA(wrap);
        else if (d.modo==="OCR") renderModoOCR(wrap);

        // ---- 2. Ítems (lo más importante) ----
        renderLineasFactura(wrap);
        // ---- 3. Monto total y ajuste (+ prorrateo) ----
        renderAjustesFactura(wrap);
        // ---- 4. Datos básicos de la factura ----
        renderDatosBasicos(wrap);
        // ---- 5. Totales + guardar ----
        renderTotalesYGuardar(wrap);
      }
      // Botonera de modo de ingreso: Manual (por defecto), Asistido por IA, Asistido OCR.
      function renderModoFactura(wrap){
        var d = APP.facturaDraft;
        var box = el("div",{class:"mb-3"});
        box.appendChild(el("label",{class:"form-label fw-semibold d-block mb-1"},["Modo de ingreso"]));

        modos.forEach(function(m){
          var b = el("button",{type:"button",class:"btn "+(d.modo===m.v?"btn-primary":"btn-outline-primary")},[m.t]);
          b.addEventListener("click", function(){ if(d.modo!==m.v){ d.modo=m.v; renderFactura(); } });
          grp.appendChild(b);
        });
        box.appendChild(grp);
        wrap.appendChild(box);
      }
      // Datos básicos (al final): fecha, proveedor, naturaleza, moneda y tasa de cambio.
      function renderDatosBasicos(wrap){
        var d = APP.facturaDraft;
        function colf(w,node){ var dd=el("div",{class:"col-12 col-md-"+w}); dd.appendChild(node); return dd; }
        var sec = el("div",{class:"border rounded p-3 mt-3"});
        sec.appendChild(el("h2",{class:"h6"},["Datos de la factura"]));
        var head = el("div",{class:"row g-3"});

        head.appendChild(colf(3, campo("Fecha", inFecha)));
        var inProv = inputText("facProv", d.proveedor, {placeholder:"Nombre del proveedor"});
        inProv.setAttribute("list","facProvList");
        inProv.addEventListener("change", function(){ d.proveedor=readVal("facProv"); });

        var provCampo = campo("Proveedor", inProv); provCampo.appendChild(dl);
        head.appendChild(colf(3, provCampo));
        var inNat = selectField("facNat", ["Insumo","Servicio"], d.naturaleza);
        inNat.addEventListener("change", function(){ d.naturaleza=readVal("facNat"); d.lineas.forEach(function(l){ l.refId=""; l.nuevoNombre=""; }); renderFactura(); });
        head.appendChild(colf(3, campo("Naturaleza", inNat)));
        var inMon = selectField("facMon", [{value:"Bs",label:"Bolívares (Bs)"},{value:"USD",label:"Dólares (USD)"},{value:"EUR",label:"Euros (EUR)"}], d.moneda);

      // Normaliza la moneda que devuelva la IA a Bs / USD / EUR (acepta sinónimos).
      function normalizarMoneda(m){
        var s = String(m||"").trim().toLowerCase();
        if (!s) return null;
        if (s==="bs"||s==="bs."||s==="ves"||s==="bsd"||s.indexOf("bol")===0) return "Bs";
        if (s==="usd"||s==="$"||s==="us$"||s.indexOf("dol")===0||s.indexOf("d\u00f3l")===0) return "USD";
        if (s==="eur"||s==="\u20ac"||s.indexOf("eur")===0) return "EUR";
        return null;
      }
      // Normaliza la fecha a AAAA-MM-DD (acepta DD/MM/AAAA y AAAA/MM/DD).
      function normalizarFecha(s){
        s = String(s||"").trim();
        if (!s) return null;
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        var m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
        if (m) return m[3]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[1]).padStart(2,"0");
        var m2 = s.match(/^(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})$/);
        if (m2) return m2[1]+"-"+String(m2[2]).padStart(2,"0")+"-"+String(m2[3]).padStart(2,"0");
        return null;
      }
      function aplicarLineasDesdeDatos(arr, total, meta){
        var d = APP.facturaDraft;
        meta = meta || {};
        if (!arr || !arr.length){ flash("No se encontraron l\u00edneas v\u00e1lidas.","warning"); return; }
        var esInsumo = d.naturaleza!=="Servicio";
        var reconocidas = 0;
        var nuevas = arr.map(function(it){
          var l = nuevaLinea();
          // Descripci\u00f3n original tal como aparece en la factura (la conserva la IA).
          l.descOriginal = String(it.descripcion || it.descripcionOriginal || it.nombre || it.concepto || "").trim();
          // Nombre can\u00f3nico sugerido por la IA (nombre del cat\u00e1logo) o vac\u00edo si no lo reconoci\u00f3.
          var canon = String((esInsumo ? (it.insumo!=null?it.insumo:it.insumoReconocido) : (it.servicio!=null?it.servicio:it.servicioReconocido)) || "").trim();
          l.unidad = String(it.unidad || "").trim();
          l.cantidad = Number(it.cantidad || it.cant || 1) || 1;
          l.montoOriginal = Number(it.montoOriginal != null ? it.montoOriginal : (it.monto != null ? it.monto : (it.total != null ? it.total : 0))) || 0;
          // Intentar emparejar con un \u00edtem existente (por nombre can\u00f3nico o alias; luego por la descripci\u00f3n original).
          var ref = null;
          if (esInsumo) ref = buscarInsumoPorNombre(canon) || buscarInsumoPorNombre(l.descOriginal);
          else ref = buscarServicioPorNombre(canon) || buscarServicioPorNombre(l.descOriginal);
          if (ref){ l.refId = ref.id; l.nuevoNombre = ""; reconocidas++; }
          else { l.refId = ""; l.nuevoNombre = canon || l.descOriginal; }
          return l;
        });
        d.lineas = nuevas.length ? nuevas : [ nuevaLinea() ];
        var detalles = [];
        // Proveedor
        if (meta.proveedor){ var pv=String(meta.proveedor).trim(); if(pv){ d.proveedor=pv; detalles.push("proveedor"); } }
        // Fecha
        if (meta.fecha){ var fx=normalizarFecha(meta.fecha); if(fx){ d.fecha=fx; detalles.push("fecha"); } }
        // Moneda
        var monCambio=false;
        if (meta.moneda){ var mn=normalizarMoneda(meta.moneda); if(mn && mn!==d.moneda){ d.moneda=mn; monCambio=true; detalles.push("moneda"); } }
        var huboTotal = (total != null && !isNaN(Number(total)));
        if (huboTotal){ d.montoTotalFactura = Number(total)||0; detalles.push("monto total"); }
        recomputarAjuste();
        var extra = detalles.length ? " Tambi\u00e9n se trajo: "+detalles.join(", ")+"." : "";
        var noRec = nuevas.length - reconocidas;
        var recMsg = reconocidas ? (" "+reconocidas+" se reconoci\u00f3(eron) autom\u00e1ticamente.") : "";
        var pendMsg = noRec>0 ? (" Falta(n) "+noRec+" por asignar.") : "";
        flash("Se cargaron "+nuevas.length+" l\u00ednea(s)."+recMsg+pendMsg+" Rev\u00edsalas."+extra,"success");
        if (monCambio) recargarTasa(); else renderFactura();
      }
      // Prompt que el usuario copia y entrega a su IA junto con el archivo de la factura.

        var catLines = get(ent).slice().sort(function(a,b){ return String(a.nombre||"").localeCompare(String(b.nombre||"")); })

        var catBloque = catLines.length ? catLines.join("\n") : ("(a\u00fan no hay " + (esInsumo?"insumos":"servicios") + " registrados)");
        var lineObj = esInsumo
          ? '    { "descripcion": "texto tal cual aparece en la factura", "insumo": "nombre EXACTO del cat\u00e1logo o vac\u00edo si no lo reconoces", "cantidad": 1, "montoOriginal": 0 }'
          : '    { "descripcion": "texto tal cual aparece en la factura", "servicio": "nombre EXACTO del cat\u00e1logo o vac\u00edo si no lo reconoces", "cantidad": 1, "montoOriginal": 0 }';
        var out = [
          "Eres un asistente que extrae los datos de una factura.",
          "Te adjunto una factura (puede ser una imagen, un PDF o cualquier formato).",
          "Lee la factura y devuelve \u00daNICAMENTE un JSON v\u00e1lido, sin texto adicional ni explicaciones, con esta estructura exacta:",
          "",
          "{",
          '  "proveedor": "nombre del proveedor o emisor de la factura",',
          '  "fecha": "AAAA-MM-DD",',
          '  "moneda": "Bs | USD | EUR",',
          '  "total": 0,',
          '  "lineas": [',
          lineObj,
          "  ]",
          "}",
          "",
          "Cat\u00e1logo de " + (esInsumo?"insumos":"servicios") + " ya registrados (empareja cada l\u00ednea con uno de estos cuando corresponda):",
          catBloque,
          "",
          "Reglas:",
          "- 'moneda' debe ser exactamente Bs (bol\u00edvares), USD (d\u00f3lares) o EUR (euros).",
          "- 'fecha' en formato AAAA-MM-DD.",
          "- 'total' es el monto total de la factura (n\u00famero, sin s\u00edmbolos ni separadores de miles).",
          "- 'descripcion': copia el texto del art\u00edculo tal como aparece en la factura (con su marca si la trae)."
        ];
        if (esInsumo){
          out.push(
            "- 'insumo': si la l\u00ednea corresponde a uno del cat\u00e1logo, pon su nombre EXACTO (aunque en la factura venga con otra marca o un nombre distinto). Si no reconoces a cu\u00e1l corresponde, d\u00e9jalo vac\u00edo.",
            "- 'cantidad': convi\u00e9rtela a la UNIDAD del insumo del cat\u00e1logo que elegiste. Si dejaste 'insumo' vac\u00edo, pon la cantidad tal como viene en la factura.",
            "  Equivalencias para convertir:",
            "    1 L = 1000 ml ; 1 ml = 1 cc (son lo mismo) ; 1 kg = 1000 g ; y adem\u00e1s ml/cc \u2194 g se tratan 1:1 (1 ml = 1 g).",
            "  Ejemplo: el insumo del cat\u00e1logo es 'Aceite' con unidad 'ml'; la factura trae 'Aceite Marca X 1,5 L' => insumo \"Aceite\", cantidad 1500."
          );
        } else {
          out.push("- 'servicio': si la l\u00ednea corresponde a uno del cat\u00e1logo, pon su nombre EXACTO. Si no, d\u00e9jalo vac\u00edo.");
        }
        out.push(
          "- 'montoOriginal': monto de esa l\u00ednea en la moneda de la factura (n\u00famero). NO lo modifiques por la conversi\u00f3n de cantidad.",
          "- Usa punto como separador decimal. Si un dato no aparece, usa vac\u00edo para texto o 0 para n\u00fameros.",
          "- Responde solo con el JSON."
        );
        return out.join("\n");
      }
      // Intenta copiar al portapapeles (API moderna y, si falla, execCommand).
      function copiarAlPortapapeles(texto){
        function ok(){ flash("Instrucciones copiadas al portapapeles. P\u00e9galas en tu IA junto con la factura.","success"); }
        function fallo(){ flash("No se pudo copiar autom\u00e1ticamente en este espacio. Av\u00edsame y vemos otra forma.","warning"); }
        function viaExec(){
          try {
            var ta = document.createElement("textarea");
            ta.value = texto; ta.setAttribute("readonly","readonly");
            ta.style.position="fixed"; ta.style.top="-1000px"; ta.style.opacity="0";
            document.body.appendChild(ta); ta.focus(); ta.select();
            var exito = false;
            try { exito = document.execCommand("copy"); } catch(e){ exito = false; }
            document.body.removeChild(ta);
            exito ? ok() : fallo();
          } catch(e){ fallo(); }
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(texto).then(ok).catch(viaExec);
          } else { viaExec(); }
        } catch(e){ viaExec(); }
      }

            aplicarLineasDesdeDatos(data.lineas, total, meta); return;

      function idOf(res){ if(res==null) return null; if(typeof res==="object") return res.id||res._id||res.docId||null; return res; }
      function ensureProveedor(nombre){
        nombre = (nombre||"").trim();
        if(!nombre) return Promise.resolve();
        var existe = get("Proveedor").some(function(p){ return (p.nombre||"").toLowerCase()===nombre.toLowerCase(); });
        if(existe) return Promise.resolve();
        return sdAdd("Proveedor", { nombre:nombre, rif:"", telefono:"", contacto:"", notas:"" });
      }
      function resolveRefs(lineas, naturaleza){
        var ent = naturaleza==="Servicio" ? "Servicio" : "Insumo";
        var i = 0;
        function next(){
          if (i>=lineas.length) return Promise.resolve();
          var l = lineas[i++];
          if (l.refId!=="__nuevo__") return next();
          var base = { nombre:(l.nuevoNombre||"").trim(), categoria:"", descripcion:"", ultimoProveedor:"", ultimoCostoUSD:0 };
          if (ent==="Insumo"){ base.unidad=l.unidad||""; base.existencia=0; base.consumoDiario=0; base.consumoMetodo="directo"; base.consumoValor=0; base.consumoDiasUnidad=0; base.stockMinimoDias=0; base.diasCompra=0; base.ultCompraCostoUSD=0; base.ultCompraCantidad=0; base.fechaUltimoInventario=APP.facturaDraft.fecha; base.alias=[]; base.esGeneral=false; base.llevaPlan=false; base.plan=[]; }
          return sdAdd(ent, base).then(function(res){ l.refId = idOf(res); return next(); });
        }
        return next();
      }
      function guardarLineas(facturaId, lineas, naturaleza){
        var i = 0;
        function next(){
          if (i>=lineas.length) return Promise.resolve();
          var l = lineas[i++];
          var finalMon = netoLinea(l);
          var finalUSD = lineaAUSD(finalMon);
          var cant = Number(l.cantidad)||0;
          var doc = { facturaId:facturaId, tipo:naturaleza, refId:l.refId, cantidad:cant,
            montoFinalAjustado:finalMon, montoFinalAjustadoUSD:finalUSD };
          return sdAdd("LineaFactura", doc).then(function(){
            var costoUnitUSD = cant ? (finalUSD/cant) : finalUSD;
            if (naturaleza==="Insumo"){
              var ins = findById("Insumo", l.refId);
              if (ins){
                var patchIns = {
                  existencia: (Number(ins.existencia)||0) + cant,
                  ultimoProveedor: APP.facturaDraft.proveedor,
                  ultimoCostoUSD: costoUnitUSD,
                  ultCompraCostoUSD: finalUSD,
                  ultCompraCantidad: cant
                };
                // Aprendizaje de alias: recordar el nombre de la factura como otro nombre del insumo.
                if (l.recordarAlias && l.descOriginal){
                  var al = aliasList(ins);
                  var yaEsta = normNombre(ins.nombre)===normNombre(l.descOriginal) ||
                    al.some(function(a){ return normNombre(a)===normNombre(l.descOriginal); });
                  if (!yaEsta){ al.push(l.descOriginal.trim()); patchIns.alias = al; }
                }
                return sdUpdate(ins.id, patchIns).then(next);
              }
            } else {
              var sv = findById("Servicio", l.refId);
              if (sv){
                return sdUpdate(sv.id, { ultimoProveedor: APP.facturaDraft.proveedor, ultimoCostoUSD: costoUnitUSD }).then(next);
              }
            }
            return next();
          });
        }
        return next();
      }
      function guardarFactura(saveBtn){
        var d = APP.facturaDraft;
        if (readOnly()){ flash("Modo solo lectura.","warning"); return; }
        if (!(d.proveedor||"").trim()){ flash("Indica el proveedor.","warning"); return; }
        var lineas = d.lineas.filter(function(l){ return (l.refId=="__nuevo__" && (l.nuevoNombre||"").trim()) || (l.refId && l.refId!=="" && l.refId!=="__nuevo__"); });
        if (!lineas.length){ flash("Añade al menos una línea con "+(d.naturaleza==="Servicio"?"servicio":"insumo")+" asignado.","warning"); return; }
        var incompleta = d.lineas.some(function(l){ return l.refId==="__nuevo__" && !(l.nuevoNombre||"").trim(); });
        if (incompleta){ flash("Hay líneas marcadas como “crear nuevo” sin nombre.","warning"); return; }
        if (tasaNeeded(d.moneda) && !d.tasaDolar){ flash("Ingresa la tasa de cambio para convertir a USD.","warning"); return; }
        var base = lineas.reduce(function(s,l){ return s+(Number(l.montoOriginal)||0); },0);
        if (base<=0){ flash("Los montos de las líneas deben ser mayores a cero.","warning"); return; }
        saveBtn.disabled = true;
        var nat = d.naturaleza;
        ensureProveedor(d.proveedor)
          .then(function(){ return resolveRefs(lineas, nat); })
          .then(function(){
            var t = totalesFactura();
            var fac = { fecha:d.fecha, proveedor:(d.proveedor||"").trim(), naturaleza:nat, moneda:d.moneda,
              tasaDolar:Number(d.tasaDolar)||0, tasaEuro:Number(d.tasaEuro)||0,
              montoTotalFactura:Number(d.montoTotalFactura)||0, ajusteNeto:Number(d.ajusteNeto)||0, prorrateado:!!d.prorratear,
              totalFinal:t.final, totalFinalUSD:t.finalUSD, mes:monthKey(d.fecha) };
            return sdAdd("Factura", fac);
          })
          .then(function(res){ return guardarLineas(idOf(res), lineas, nat); })
          .then(function(){
            flash("Factura guardada correctamente.","success");
            APP.facturaDraft = null;
            APP.view = "Tablero";
            return refresh(["Factura","LineaFactura","Insumo","Servicio","Proveedor"]);
          })
          .catch(function(e){ saveBtn.disabled=false; showError(e); });
      }

        var fecha = todayISO();
        var existSistema = Number(ins.existencia)||0;
        var transc = ins.fechaUltimoInventario ? daysBetween(ins.fechaUltimoInventario, fecha) : 0;
        if (transc < 0) transc = 0;
        var consumido = existSistema - contada;
        var consumoAplicado = (transc > 0 && consumido >= 0) ? (consumido/transc) : (Number(ins.consumoDiario)||0);
        var reg = { insumoId:ins.id, fecha:fecha, existenciaAnterior:existSistema, contada:contada,
          diasTranscurridos:transc, consumoAplicado:consumoAplicado };
        btn.disabled = true;
        sdAdd("InventarioFisico", reg)
          .then(function(){ return sdUpdate(ins.id, { existencia:contada, fechaUltimoInventario:fecha, consumoDiario:consumoAplicado, consumoMetodo:"directo", consumoValor:consumoAplicado, consumoDiasUnidad:0 }); })
          .then(function(){ flash("Inventario de “"+(ins.nombre||"")+"” actualizado.","success"); return refresh(["InventarioFisico","Insumo"]); })
          .catch(function(e){ btn.disabled=false; showError(e); });
      }
      function formInventario(c, ins){
        if (!ins){ APP.invInsumoId=null; viewInventario(c); return; }
        var volver = el("button",{class:"btn btn-outline-secondary",type:"button"},["← Volver"]);
        volver.addEventListener("click", function(){ APP.invInsumoId=null; render(); });
        h(c, "Inventario: "+ins.nombre, volver);
        var existSistema = Number(ins.existencia)||0;
        var frm = el("div",{class:"row g-3"});
        function colf(node){ var d=el("div",{class:"col-12 col-md-6 col-lg-4"}); d.appendChild(node); return d; }
        frm.appendChild(colf(campo("Fecha del conteo", inputFecha("invFecha", todayISO()))));
        frm.appendChild(colf(campo("Existencia según sistema", inputText("invSistema", num2(existSistema), {disabled:true}))));
        frm.appendChild(colf(campo("Cantidad contada (real)", inputNumero("invContada", existSistema, {min:0, decimals:2, allowNegatives:false}))));
        c.appendChild(frm);
        var resumen = el("div",{id:"invResumen",class:"alert alert-secondary"});
        c.appendChild(resumen);
        var frm2 = el("div",{class:"row g-3"});
        frm2.appendChild(colf(campo("Consumo diario a aplicar", inputNumero("invConsumo", ins.consumoDiario||0, {min:0, decimals:4, allowNegatives:false}))));
        c.appendChild(frm2);
        c.appendChild(el("p",{class:"text-small text-muted"},["El consumo propuesto se calcula como (existencia del sistema − contada) ÷ días transcurridos desde el último inventario. Puedes ajustarlo antes de guardar."]));

        function recalcular(){
          var fecha = readVal("invFecha");
          var contada = readNumero("invContada");
          var transc = ins.fechaUltimoInventario ? daysBetween(ins.fechaUltimoInventario, fecha) : 0;
          if (transc < 0) transc = 0;
          var consumido = existSistema - contada;
          var propuesto = (transc > 0 && consumido >= 0) ? (consumido / transc) : null;
          clear(resumen);
          resumen.appendChild(el("div",{},["Días transcurridos desde el último inventario ("+(ins.fechaUltimoInventario||"n/d")+"): "+transc]));
          resumen.appendChild(el("div",{},["Consumo estimado del período: "+num2(consumido>0?consumido:0)+" "+(ins.unidad||"")]));
          resumen.appendChild(el("div",{},["Consumo diario propuesto: "+(propuesto==null?"— (sin días suficientes)":num2(propuesto))]));
          if (propuesto != null){ var ci=byId("invConsumo"); if(ci) ci.setAttribute("value", String(propuesto)); }
        }
        byId("invFecha").addEventListener("change", recalcular);
        byId("invContada").addEventListener("change", recalcular);
        recalcular();

        var acciones = el("div",{class:"d-flex gap-2 mt-2"});
        var save = el("button",{class:"btn btn-success",type:"button"},["Guardar inventario"]);
        save.disabled = readOnly();
        save.addEventListener("click", function(){
          var fecha = readVal("invFecha");
          var contada = readNumero("invContada");
          var consumoAplicado = readNumero("invConsumo");
          var transc = ins.fechaUltimoInventario ? daysBetween(ins.fechaUltimoInventario, fecha) : 0;
          if (transc < 0) transc = 0;
          var reg = { insumoId:ins.id, fecha:fecha, existenciaAnterior:existSistema, contada:contada,
            diasTranscurridos:transc, consumoAplicado:consumoAplicado };
          save.disabled = true;
          sdAdd("InventarioFisico", reg)
            .then(function(){ return sdUpdate(ins.id, { existencia:contada, fechaUltimoInventario:fecha, consumoDiario:consumoAplicado, consumoMetodo:"directo", consumoValor:consumoAplicado, consumoDiasUnidad:0 }); })
            .then(function(){ flash("Inventario registrado. Se reinició la base de existencia.","success"); APP.invInsumoId=null; return refresh(["InventarioFisico","Insumo"]); })
            .catch(function(e){ save.disabled=false; showError(e); });
        });
        var cancel = el("button",{class:"btn btn-outline-secondary",type:"button"},["Cancelar"]);
        cancel.addEventListener("click", function(){ APP.invInsumoId=null; render(); });
        acciones.appendChild(save); acciones.appendChild(cancel);
        c.appendChild(acciones);
      }

      // ================= REPORTES (13 meses) =================
      function ultimosMeses(n){
        var out = [], d = parseLocal(todayISO());
        for (var i=0;i<n;i++){ var m=String(d.getMonth()+1).padStart(2,"0"); out.push(d.getFullYear()+"-"+m); d.setMonth(d.getMonth()-1); }
        return out; // más reciente primero
      }
      function datosReporte(){
        var meses = ultimosMeses(13);
        var mesSet = {}; meses.forEach(function(m){ mesSet[m]=true; });
        var facById = {}; get("Factura").forEach(function(f){ facById[f.id]=f; });
        var items = [];
        get("LineaFactura").forEach(function(l){
          var f = facById[l.facturaId]; if(!f) return;
          var mk = monthKey(f.fecha); if(!mesSet[mk]) return;
          var ref = l.tipo==="Servicio" ? findById("Servicio", l.refId) : findById("Insumo", l.refId);
          items.push({ mes:mk, proveedor:f.proveedor||"(sin proveedor)", tipo:l.tipo,
            refNombre: ref ? ref.nombre : "(eliminado)",
            categoria: ref ? (nombreCategoria(ref.categoria)||"(sin categoría)") : "(sin categoría)",
            usd: Number(l.montoFinalAjustadoUSD)||0 });
        });
        return { meses:meses, items:items };
      }
      function agrupar(items, keyFn){
        var map = {};
        items.forEach(function(it){ var k=keyFn(it); map[k]=(map[k]||0)+it.usd; });
        return Object.keys(map).map(function(k){ return { clave:k, total:map[k] }; })
          .sort(function(a,b){ return b.total-a.total; });
      }
      function viewReportes(c){
        h(c, "Reportes (últimos 13 meses)");
        var rep = datosReporte();
        if (!rep.items.length){ c.appendChild(el("p",{class:"text-muted"},["Aún no hay facturas registradas en los últimos 13 meses."])); return; }
        if (!APP.repMes) APP.repMes = "ALL";

        // Gasto por mes (todas las facturas, no depende del filtro)
        c.appendChild(el("h2",{class:"h5"},["Gasto por mes (USD)"]));
        var porMes = rep.meses.map(function(m){
          var tot = rep.items.filter(function(it){ return it.mes===m; }).reduce(function(s,it){ return s+it.usd; },0);
          return { Mes:m, TotalUSD:money(tot), _t:tot };
        });
        var maxMes = Math.max.apply(null, porMes.map(function(r){ return r._t; }).concat([0]));
        var barWrap = el("div",{class:"mb-3"});
        porMes.slice().reverse().forEach(function(r){
          var row = el("div",{class:"d-flex align-items-center gap-2 mb-1"});
          row.appendChild(el("div",{class:"text-small nowrap",style:"width:72px"},[r.Mes]));
          var track = el("div",{class:"flex-grow-1 bg-light rounded",style:"height:18px;position:relative"});
          var w = maxMes? Math.round(r._t/maxMes*100):0;
          track.appendChild(el("div",{class:"bg-primary rounded",style:"height:18px;width:"+w+"%"},[]));
          row.appendChild(track);
          row.appendChild(el("div",{class:"text-small nowrap text-end",style:"width:110px"},[r.TotalUSD]));
          barWrap.appendChild(row);
        });
        c.appendChild(barWrap);

        // Filtro de mes para los desgloses
        var filtRow = el("div",{class:"d-flex align-items-end gap-2 mb-2 flex-wrap"});
        var opts = [{value:"ALL",label:"Todos (13 meses)"}].concat(rep.meses.map(function(m){ return {value:m,label:m}; }));
        var sel = selectField("repMes", opts, APP.repMes);
        sel.classList.add("w-auto");
        sel.addEventListener("change", function(){ APP.repMes=readVal("repMes"); render(); });
        var lbl = el("div",{},[ el("label",{class:"form-label mb-1"},["Desglose del período"]), sel ]);
        filtRow.appendChild(lbl);
        c.appendChild(filtRow);

        var items = APP.repMes==="ALL" ? rep.items : rep.items.filter(function(it){ return it.mes===APP.repMes; });
        var totalPer = items.reduce(function(s,it){ return s+it.usd; },0);
        c.appendChild(el("div",{class:"alert alert-info"},["Gasto total del período seleccionado: "+money(totalPer)]));

        function tablaAgrupada(titulo, etiqueta, filas){
          c.appendChild(el("h2",{class:"h6 mt-3"},[titulo]));
          if(!filas.length){ c.appendChild(el("p",{class:"text-muted"},["Sin datos."])); return; }
          var rows = filas.map(function(r){ var o={}; o[etiqueta]=r.clave; o["TotalUSD"]=money(r.total); return o; });
          mountTable(c, [ {key:etiqueta,label:etiqueta},{key:"TotalUSD",label:"Total USD"} ], rows, null, {pageSize:20});
        }
        tablaAgrupada("Por categoría", "Categoría", agrupar(items, function(it){ return it.categoria; }));
        tablaAgrupada("Por insumo / servicio", "Insumo/Servicio", agrupar(items, function(it){ return it.refNombre+" ("+it.tipo+")"; }));
        tablaAgrupada("Por proveedor", "Proveedor", agrupar(items, function(it){ return it.proveedor; }));
      }

    });
  }
  </script>
</body>
</html>
