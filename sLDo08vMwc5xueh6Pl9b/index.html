<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Condominio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <style>
    body { padding-top: 60px; background-color: #f8f9fa; }
    .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
    #app-container { min-height: 80vh; background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
    
    .cursor-pointer { cursor: pointer; }
    
    .bar-chart { fill: #0d6efd; }
    .bar-chart:hover { fill: #0b5ed7; }
    .line-chart { fill: none; stroke: #dc3545; stroke-width: 2; }
    .point-chart { fill: #dc3545; }

    /* Estilos específicos para la Tabla de Presupuestos */
    .th-dark { background-color: #2c3e50 !important; color: white !important; border-color: #2c3e50 !important; }
    .tr-gastos td { background-color: #f8f9fa !important; font-weight: bold; border-top: 2px solid #2c3e50 !important; color: black !important; }
    .tr-ingreso td { color: #198754 !important; }
    .tr-tot-ingresos td { background-color: #e8f5e9 !important; color: #198754 !important; font-weight: bold; border-bottom: 2px solid #198754 !important; }
    .tr-neto td { background-color: #f8ecec !important; color: #dc3545 !important; font-weight: bold; border-bottom: 2px solid #2c3e50 !important; }
    .tr-tot-apto td { background-color: #aeb6bf !important; font-weight: bold; font-size: 1.1em; }
    .tr-tot-apto td:first-child { color: white !important; }
    .tr-tot-apto td.monto-red { color: #dc3545 !important; }
    
    @media print {
      body { padding-top: 0; background-color: white; }
      .navbar, .d-print-none, .print-hide { display: none !important; }
      #app-container { box-shadow: none; padding: 0; }
      
      /* Forzar impresión de colores de fondo en Chrome/Safari/Edge */
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      
      .table th { background-color: #f8f9fa !important; color: #000 !important; }
      .th-dark { background-color: #2c3e50 !important; color: white !important; }
      .tr-gastos td { background-color: #f8f9fa !important; color: black !important; }
      .tr-ingreso td { color: #198754 !important; }
      .tr-tot-ingresos td { background-color: #e8f5e9 !important; color: #198754 !important; }
      .tr-neto td { background-color: #f8ecec !important; color: #dc3545 !important; }
      .tr-tot-apto td { background-color: #aeb6bf !important; }
      .tr-tot-apto td:first-child { color: white !important; }
      .tr-tot-apto td.monto-red { color: #dc3545 !important; }
      .deuda-alta { font-weight: bold; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top d-print-none">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1 cursor-pointer" id="nav-brand">🏠 <span id="brand-text">CondoApp</span></span>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-dashboard">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-directorio">Directorio</a></li>
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-conceptos">Conceptos</a></li>
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-presupuestos">Presupuestos</a></li>
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-cargos">Cargos Esp.</a></li>
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-caja">Caja</a></li>
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-reportes">Reportes</a></li>
          <li class="nav-item"><a class="nav-link cursor-pointer" id="nav-perfil">Perfil</a></li>
        </ul>
        <div class="d-flex align-items-center">
            <span class="text-light me-3 small" id="tasa-del-dia">Cargando tasa...</span>
        </div>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <div id="app-container">
      <div class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <h4 class="mt-3 text-muted">Iniciando sistema...</h4>
      </div>
    </div>
  </div>

  <script>
    const Utils = {
      crearElemento(etiqueta, atributos = {}) {
        const el = document.createElement(etiqueta);
        for (const [key, value] of Object.entries(atributos)) {
          el.setAttribute(key, value);
        }
        return el;
      },
      crearElementoSVG(etiqueta, atributos = {}) {
        const el = document.createElementNS('http://www.w3.org/2000/svg', etiqueta);
        for (const [key, value] of Object.entries(atributos)) {
          el.setAttribute(key, value);
        }
        return el;
      },
      mostrarError(contenedor, mensaje, reintentarCallback = null) {
        contenedor.replaceChildren();
        const alert = this.crearElemento('div', { class: 'alert alert-danger shadow-sm' });
        const h4 = this.crearElemento('h4', { class: 'alert-heading' }); h4.textContent = 'Error'; alert.appendChild(h4);
        const p = this.crearElemento('p'); p.textContent = mensaje; alert.appendChild(p);
        if (reintentarCallback) {
          const btn = this.crearElemento('button', { class: 'btn btn-outline-danger mt-3' });
          btn.textContent = 'Reintentar'; btn.addEventListener('click', reintentarCallback); alert.appendChild(btn);
        }
        contenedor.appendChild(alert);
      },
      mostrarCargando(contenedor) {
        contenedor.replaceChildren();
        const div = this.crearElemento('div', { class: 'text-center my-5' });
        const spinner = this.crearElemento('div', { class: 'spinner-border text-primary', role: 'status' });
        div.appendChild(spinner); contenedor.appendChild(div);
      },
      async consultarTasaBCV(fechaYYYYMMDD) {
        const fechaFormat = fechaYYYYMMDD.replace(/-/g, '/');
        try {
          const url = `https://ve.dolarapi.com/v1/historicos/dolares/oficial/${fechaFormat}`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
          const data = await response.json();
          if (data && data.promedio) return parseFloat(data.promedio);
          throw new Error('Respuesta mal formada');
        } catch (error) {
          console.warn('Error consultando DolarAPI:', error);
          throw error;
        }
      },
      obtenerFechaHoyISO() {
          return new Date().toISOString().split('T')[0];
      },
      ordenarApartamentos(aptos) {
          aptos.sort((a, b) => (a.orden ?? 99999) - (b.orden ?? 99999));
      },
      async cargarPerfil() {
        const docs = await SecureDoc.data.list({ where: [['esPerfil', '==', true]] });
        return docs.length > 0 ? docs[0] : null;
      },
      generarCabeceraReporte(perfil, tituloPrincipal, subtituloExtra = '') {
        const cabeceraDoc = this.crearElemento('div', { class: 'd-flex justify-content-between align-items-center mb-4 border-bottom pb-3' });
        const divInfo = this.crearElemento('div', { class: 'text-start' });
        
        const tituloCondo = this.crearElemento('h2', { class: 'text-uppercase fw-bold mb-1 text-primary' });
        tituloCondo.textContent = perfil?.nombreCondominio || 'Condominio';
        divInfo.appendChild(tituloCondo);

        const subTit = this.crearElemento('h4', { class: 'mb-2' });
        subTit.textContent = tituloPrincipal;
        divInfo.appendChild(subTit);

        if (perfil?.encargado) {
            const enc = this.crearElemento('p', { class: 'mb-0 fw-bold text-dark' }); 
            enc.textContent = `Encargado: ${perfil.encargado}`;
            divInfo.appendChild(enc);
        }
        
        if (subtituloExtra) {
            const extra = this.crearElemento('p', { class: 'text-muted mb-0 small' });
            extra.textContent = subtituloExtra;
            divInfo.appendChild(extra);
        }
        cabeceraDoc.appendChild(divInfo);

        if (perfil?.logo) {
            const img = this.crearElemento('img', { src: perfil.logo, style: 'max-height: 90px; max-width: 200px; object-fit: contain;' });
            cabeceraDoc.appendChild(img);
        }
        return cabeceraDoc;
      }
    };

    // 0. PERFIL
    const Perfil = {
      perfilId: null,
      logoBase64: '',

      async render(contenedor) {
        Utils.mostrarCargando(contenedor);
        try {
          const perfil = await Utils.cargarPerfil();
          
          if (perfil) {
             this.perfilId = perfil.id;
             this.logoBase64 = perfil.logo || '';
          } else {
             this.perfilId = null;
             this.logoBase64 = '';
          }

          contenedor.replaceChildren();

          const header = Utils.crearElemento('div', { class: 'mb-4' });
          const titulo = Utils.crearElemento('h3'); titulo.textContent = 'Perfil del Condominio';
          const subtitulo = Utils.crearElemento('p', { class: 'text-muted' }); subtitulo.textContent = 'Configure los datos que aparecerán en los reportes y en la barra superior.';
          header.appendChild(titulo); header.appendChild(subtitulo); contenedor.appendChild(header);

          const card = Utils.crearElemento('div', { class: 'card shadow-sm mx-auto', style: 'max-width: 600px;' });
          const cBody = Utils.crearElemento('div', { class: 'card-body p-4' });
          
          const form = Utils.crearElemento('form');
          form.addEventListener('submit', (e) => this.guardar(e, contenedor));

          const dNom = Utils.crearElemento('div', { class: 'mb-3' });
          const lNom = Utils.crearElemento('label', { class: 'form-label fw-bold' }); lNom.textContent = 'Nombre del Condominio';
          this.iNom = Utils.crearElemento('input', { type: 'text', class: 'form-control', required: 'true', placeholder: 'Ej. Residencias El Sol' });
          if(perfil) this.iNom.value = perfil.nombreCondominio || '';
          dNom.appendChild(lNom); dNom.appendChild(this.iNom); form.appendChild(dNom);

          const dEnc = Utils.crearElemento('div', { class: 'mb-3' });
          const lEnc = Utils.crearElemento('label', { class: 'form-label fw-bold' }); lEnc.textContent = 'Encargado / Administrador';
          this.iEnc = Utils.crearElemento('input', { type: 'text', class: 'form-control', placeholder: 'Ej. Junta de Condominio' });
          if(perfil) this.iEnc.value = perfil.encargado || '';
          dEnc.appendChild(lEnc); dEnc.appendChild(this.iEnc); form.appendChild(dEnc);

          const dLogo = Utils.crearElemento('div', { class: 'mb-4' });
          const lLogo = Utils.crearElemento('label', { class: 'form-label fw-bold' }); lLogo.textContent = 'Logo (Imagen)';
          const iLogo = Utils.crearElemento('input', { type: 'file', class: 'form-control', accept: 'image/png, image/jpeg, image/jpg' });
          
          this.imgPreview = Utils.crearElemento('img', { style: 'max-height: 100px; margin-top: 10px; object-fit: contain;' });
          if (this.logoBase64) {
            this.imgPreview.src = this.logoBase64;
          } else {
            this.imgPreview.classList.add('d-none');
          }

          iLogo.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
              const imgObj = new Image();
              imgObj.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const MAX_WIDTH = 250; const MAX_HEIGHT = 250;
                let w = imgObj.width, h = imgObj.height;

                if (w > h) { if (w > MAX_WIDTH) { h *= MAX_WIDTH / w; w = MAX_WIDTH; } } 
                else { if (h > MAX_HEIGHT) { w *= MAX_HEIGHT / h; h = MAX_HEIGHT; } }
                
                canvas.width = w; canvas.height = h;
                ctx.drawImage(imgObj, 0, 0, w, h);
                const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                
                if (dataUrl.length > 55000) {
                   alert("La imagen seleccionada sigue siendo muy pesada para almacenar. Por favor, intente con un logo más simple.");
                   iLogo.value = '';
                   return;
                }
                
                this.logoBase64 = dataUrl;
                this.imgPreview.src = dataUrl;
                this.imgPreview.classList.remove('d-none');
              };
              imgObj.src = ev.target.result;
            };
            reader.readAsDataURL(file);
          });
          
          const helpTxt = Utils.crearElemento('small', { class: 'text-muted d-block mt-1' });
          helpTxt.textContent = 'Se recomienda una imagen pequeña/cuadrada (se redimensionará automáticamente).';

          dLogo.appendChild(lLogo); dLogo.appendChild(iLogo); dLogo.appendChild(helpTxt); dLogo.appendChild(this.imgPreview); form.appendChild(dLogo);

          const btnG = Utils.crearElemento('button', { type: 'submit', class: 'btn btn-primary w-100 btn-lg' });
          btnG.textContent = 'Guardar Perfil';
          this.btnG = btnG;
          form.appendChild(btnG);

          cBody.appendChild(form); card.appendChild(cBody); contenedor.appendChild(card);
        } catch(e) {
          console.error(e); Utils.mostrarError(contenedor, "No se pudo cargar el perfil.");
        }
      },

      async guardar(e, contenedor) {
        e.preventDefault();
        this.btnG.disabled = true;
        this.btnG.textContent = 'Guardando...';

        const data = {
          esPerfil: true,
          nombreCondominio: this.iNom.value.trim(),
          encargado: this.iEnc.value.trim(),
          logo: this.logoBase64
        };

        try {
          if (this.perfilId) await SecureDoc.data.update(this.perfilId, data);
          else await SecureDoc.data.add(data);
          
          const bText = document.getElementById('brand-text');
          if (bText) bText.textContent = data.nombreCondominio || 'CondoApp';
          
          alert('Perfil guardado exitosamente.');
          this.render(contenedor);
        } catch (err) {
          console.error(err); alert('Error al guardar el perfil.'); this.btnG.disabled = false; this.btnG.textContent = 'Guardar Perfil';
        }
      }
    };

    // 1. DASHBOARD
    const Dashboard = {
      async render(contenedor) {
        Utils.mostrarCargando(contenedor);
        try {
          const apartamentos = await SecureDoc.data.list({ where: [['numero', '!=', '']] });
          Utils.ordenarApartamentos(apartamentos);
          
          let deudaTotal = 0; const deudores = [];
          apartamentos.forEach(apt => {
            const deuda = parseFloat(apt.deudaActual) || 0;
            deudaTotal += deuda; 
            if (deuda > 0) deudores.push({ numero: apt.numero, propietario: apt.propietario, deuda: deuda });
          });
          deudores.sort((a, b) => b.deuda - a.deuda);
          contenedor.replaceChildren();

          const filaCabecera = Utils.crearElemento('div', { class: 'row mb-4' });
          const colDeuda = Utils.crearElemento('div', { class: 'col-md-4' });
          const tarjetaDeuda = Utils.crearElemento('div', { class: 'card bg-primary text-white shadow-sm' });
          const cuerpoTarjeta = Utils.crearElemento('div', { class: 'card-body text-center' });
          const titulo = Utils.crearElemento('h5', { class: 'card-title text-uppercase mb-1' }); titulo.textContent = 'Deuda Total por Cobrar';
          const monto = Utils.crearElemento('h2', { class: 'card-text mb-0 fw-bold' }); monto.textContent = `$${deudaTotal.toFixed(2)}`;
          cuerpoTarjeta.appendChild(titulo); cuerpoTarjeta.appendChild(monto); tarjetaDeuda.appendChild(cuerpoTarjeta); colDeuda.appendChild(tarjetaDeuda); filaCabecera.appendChild(colDeuda); contenedor.appendChild(filaCabecera);

          if (deudores.length > 0) this.construirGrafico(contenedor, deudores);
          else {
            const msg = Utils.crearElemento('div', { class: 'alert alert-success mt-4 shadow-sm' });
            msg.textContent = '¡Excelente! Todos los apartamentos están solventes.'; contenedor.appendChild(msg);
          }
        } catch (error) {
          console.error(error); Utils.mostrarError(contenedor, "No se pudo cargar el tablero.", () => this.render(contenedor));
        }
      },
      construirGrafico(contenedor, deudores) {
        const tarjeta = Utils.crearElemento('div', { class: 'card shadow-sm' });
        const cabecera = Utils.crearElemento('div', { class: 'card-header bg-white' });
        const titulo = Utils.crearElemento('h5', { class: 'mb-0' }); titulo.textContent = 'Gráfico de Pareto: Concentración de la Deuda (80/20)';
        cabecera.appendChild(titulo);
        const cuerpo = Utils.crearElemento('div', { class: 'card-body overflow-auto' });

        const svgAncho = 800, svgAlto = 400, margen = { sup: 40, der: 50, inf: 60, izq: 60 };
        const anchoUtil = svgAncho - margen.izq - margen.der, altoUtil = svgAlto - margen.sup - margen.inf;
        const deudaTotal = deudores.reduce((s, d) => s + d.deuda, 0), maxDeuda = deudores[0].deuda;
        const anchoBarra = Math.min(40, (anchoUtil / deudores.length) * 0.8), espaciado = anchoUtil / deudores.length;
        const svg = Utils.crearElementoSVG('svg', { viewBox: `0 0 ${svgAncho} ${svgAlto}`, width: '100%', height: '100%', style: 'min-width: 600px; max-height: 400px;' });

        let acumulada = 0; const puntosLinea = [];

        const ejeYIzq = Utils.crearElementoSVG('line', { x1: margen.izq, y1: margen.sup, x2: margen.izq, y2: margen.sup + altoUtil, stroke: '#dee2e6' });
        const txtYIzq = Utils.crearElementoSVG('text', { x: margen.izq - 10, y: margen.sup + 5, 'text-anchor': 'end', 'font-size': '12px', fill: '#495057' }); txtYIzq.textContent = `$${maxDeuda.toFixed(0)}`;
        svg.appendChild(ejeYIzq); svg.appendChild(txtYIzq);

        const ejeYDer = Utils.crearElementoSVG('line', { x1: svgAncho - margen.der, y1: margen.sup, x2: svgAncho - margen.der, y2: margen.sup + altoUtil, stroke: '#dee2e6' });
        const txtYDer100 = Utils.crearElementoSVG('text', { x: svgAncho - margen.der + 10, y: margen.sup + 5, 'font-size': '12px', fill: '#dc3545' }); txtYDer100.textContent = '100%';
        svg.appendChild(ejeYDer); svg.appendChild(txtYDer100);

        const linea80Y = margen.sup + altoUtil - (0.8 * altoUtil);
        const linea80 = Utils.crearElementoSVG('line', { x1: margen.izq, y1: linea80Y, x2: svgAncho - margen.der, y2: linea80Y, stroke: '#ffc107', 'stroke-dasharray': '5,5' });
        const txt80 = Utils.crearElementoSVG('text', { x: svgAncho - margen.der + 10, y: linea80Y + 5, 'font-size': '12px', fill: '#ffc107' }); txt80.textContent = '80%';
        svg.appendChild(linea80); svg.appendChild(txt80);

        deudores.forEach((d, i) => {
          acumulada += d.deuda; const pct = acumulada / deudaTotal;
          const x = margen.izq + (i * espaciado) + (espaciado / 2);
          const altoBar = (d.deuda / maxDeuda) * altoUtil; const yBar = margen.sup + altoUtil - altoBar;
          
          const rect = Utils.crearElementoSVG('rect', { x: x - (anchoBarra / 2), y: yBar, width: anchoBarra, height: altoBar, class: 'bar-chart', rx: 2 });
          const titleRect = Utils.crearElementoSVG('title'); titleRect.textContent = `Apt: ${d.numero}\nDeuda: $${d.deuda.toFixed(2)}`; rect.appendChild(titleRect);
          const textX = Utils.crearElementoSVG('text', { x: x, y: svgAlto - margen.inf + 20, 'text-anchor': 'middle', 'font-size': '11px', fill: '#495057' }); textX.textContent = d.numero;
          svg.appendChild(rect); svg.appendChild(textX);

          const yLine = margen.sup + altoUtil - (pct * altoUtil); puntosLinea.push(`${x},${yLine}`);
          const circle = Utils.crearElementoSVG('circle', { cx: x, cy: yLine, r: 4, class: 'point-chart' });
          const titleCirc = Utils.crearElementoSVG('title'); titleCirc.textContent = `Acumulado: ${(pct * 100).toFixed(1)}%`; circle.appendChild(titleCirc);
          setTimeout(() => svg.appendChild(circle), 0);
        });

        if (puntosLinea.length > 0) {
          const pInit = `${margen.izq - (espaciado/2)},${margen.sup + altoUtil}`;
          const poly = Utils.crearElementoSVG('polyline', { points: `${pInit} ${puntosLinea.join(' ')}`, class: 'line-chart' }); svg.appendChild(poly);
        }
        cuerpo.appendChild(svg); tarjeta.appendChild(cabecera); tarjeta.appendChild(cuerpo); contenedor.appendChild(tarjeta);
      }
    };

    // 2. DIRECTORIO
    const Directorio = {
      aptEditId: null,
      async render(contenedor) {
        Utils.mostrarCargando(contenedor);
        try {
          const aptos = await SecureDoc.data.list({ where: [['numero', '!=', '']] });
          Utils.ordenarApartamentos(aptos);
          
          contenedor.replaceChildren();
          
          const header = Utils.crearElemento('div', { class: 'd-flex justify-content-between align-items-center mb-4' });
          const titulo = Utils.crearElemento('h3', { class: 'mb-0' }); titulo.textContent = 'Directorio de Apartamentos';
          const btnNuevo = Utils.crearElemento('button', { class: 'btn btn-primary' });
          btnNuevo.textContent = '+ Nuevo Apartamento';
          btnNuevo.addEventListener('click', () => this.renderForm(contenedor, null, aptos.length));
          header.appendChild(titulo); header.appendChild(btnNuevo); contenedor.appendChild(header);

          const tarjeta = Utils.crearElemento('div', { class: 'card shadow-sm' });
          const cuerpo = Utils.crearElemento('div', { class: 'card-body p-0 table-responsive' });
          const tabla = Utils.crearElemento('table', { class: 'table table-hover mb-0' });
          
          const thead = Utils.crearElemento('thead', { class: 'table-light' });
          const trHead = Utils.crearElemento('tr');
          ['Mover', 'Apt.', 'Propietario', 'Alícuota', 'Deuda (USD)', 'Acciones'].forEach(t => {
            const th = Utils.crearElemento('th', { class: 'align-middle' }); th.textContent = t; trHead.appendChild(th);
          });
          thead.appendChild(trHead); tabla.appendChild(thead);

          const tbody = Utils.crearElemento('tbody');
          if (aptos.length === 0) {
            const tr = Utils.crearElemento('tr'); const td = Utils.crearElemento('td', { colspan: '6', class: 'text-center py-3' });
            td.textContent = 'No hay apartamentos registrados.'; tr.appendChild(td); tbody.appendChild(tr);
          } else {
            aptos.forEach((apt, index) => {
              const tr = Utils.crearElemento('tr');
              
              const move = Utils.crearElemento('td', { class: 'align-middle' });
              const btnUp = Utils.crearElemento('button', { class: 'btn btn-sm btn-outline-secondary me-1' });

      async moverFila(indexActual, delta, aptos, contenedor) {

      async guardar(e, contenedor) {

    // 3. CONCEPTOS
    const Conceptos = {

          const th = Utils.crearElemento('thead', { class: 'table-light' }); const trh = Utils.crearElemento('tr');
          ['Nombre', 'Tipo', 'Monto ($)', 'Acción'].forEach(t => { const h = Utils.crearElemento('th'); h.textContent = t; trh.appendChild(h); });
          th.appendChild(trh); table.appendChild(th);
          
          const tbody = Utils.crearElemento('tbody');

    // 4. PRESUPUESTOS (Con retención de estado tipo borrador y tabla formateada)
    const Presupuestos = {
      aptos: [], conceptos: [], seleccionados: [], mes: '', perfil: null, borradorId: null,

      async render(contenedor) {
        Utils.mostrarCargando(contenedor);
        try {
          this.perfil = await Utils.cargarPerfil();
          this.aptos = await SecureDoc.data.list({ where: [['numero', '!=', '']] });
          Utils.ordenarApartamentos(this.aptos);
          this.conceptos = await SecureDoc.data.list({ where: [['nombre', '!=', '']] });
          
          // Buscar si existe un borrador guardado
          const borradores = await SecureDoc.data.list({ where: [['tipoDato', '==', 'borrador_presupuesto']] });
          if (borradores.length > 0) {
              this.borradorId = borradores[0].id;
              this.mes = borradores[0].mes;
              this.seleccionados = borradores[0].seleccionados || [];
          } else {
              const hoy = new Date(); this.mes = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
              this.seleccionados = [];
              const res = await SecureDoc.data.add({ tipoDato: 'borrador_presupuesto', mes: this.mes, seleccionados: [] });
              this.borradorId = res.id;
          }
          
          this.dibujarPaso1(contenedor);
        } catch (e) { console.error(e); Utils.mostrarError(contenedor, "Error iniciando presupuestos."); }
      },

      async guardarBorrador() {
         if (this.borradorId) {
             try {
                 await SecureDoc.data.update(this.borradorId, { mes: this.mes, seleccionados: this.seleccionados });
             } catch(e) {
                 console.warn("No se pudo guardar el borrador", e);
             }
         }
      },

      async cancelarBorrador(contenedor) {
         if(confirm('¿Desea limpiar el presupuesto actual y comenzar de cero? Se borrarán los conceptos agregados.')) {
             const hoy = new Date(); this.mes = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`;
             this.seleccionados = [];
             await this.guardarBorrador();
             this.render(contenedor);
         }
      },

      dibujarPaso1(contenedor) {
        contenedor.replaceChildren();
        const hdr = Utils.crearElemento('div', { class: 'd-flex justify-content-between align-items-center mb-4 d-print-none' });
        const t = Utils.crearElemento('h3'); t.textContent = 'Armar Presupuesto Mensual'; 
        
        const btnCancelar = Utils.crearElemento('button', { class: 'btn btn-outline-danger' });
        btnCancelar.textContent = 'Limpiar Presupuesto';
        btnCancelar.addEventListener('click', () => this.cancelarBorrador(contenedor));
        
        hdr.appendChild(t); hdr.appendChild(btnCancelar); contenedor.appendChild(hdr);

        const card = Utils.crearElemento('div', { class: 'card shadow-sm d-print-none' });
        const body = Utils.crearElemento('div', { class: 'card-body' });
        const row1 = Utils.crearElemento('div', { class: 'row mb-4 align-items-end' });
        
        const colM = Utils.crearElemento('div', { class: 'col-md-4' });
        const lM = Utils.crearElemento('label', { class: 'form-label fw-bold' }); lM.textContent = 'Mes';
        const iM = Utils.crearElemento('input', { type: 'month', class: 'form-control', value: this.mes });
        iM.addEventListener('change', e => { this.mes = e.target.value; this.guardarBorrador(); });
        colM.appendChild(lM); colM.appendChild(iM); row1.appendChild(colM);

        const colC = Utils.crearElemento('div', { class: 'col-md-6' });
        const lC = Utils.crearElemento('label', { class: 'form-label fw-bold' }); lC.textContent = 'Agregar Concepto';
        const ig = Utils.crearElemento('div', { class: 'input-group' });
        const selC = Utils.crearElemento('select', { class: 'form-select' });
        const optD = Utils.crearElemento('option', { value: '' }); optD.textContent = '-- Seleccione --'; selC.appendChild(optD);
        this.conceptos.forEach(c => {
          const o = Utils.crearElemento('option', { value: c.id }); o.textContent = `${c.nombre} ($${c.montoPreestablecido})`; selC.appendChild(o);
        });
        const btnA = Utils.crearElemento('button', { class: 'btn btn-primary' }); btnA.textContent = 'Añadir';
        btnA.addEventListener('click', () => {
          if (!selC.value) return; const bc = this.conceptos.find(x => x.id === selC.value);
          this.seleccionados.push({ id: bc.id, nombre: bc.nombre, tipo: bc.tipo, monto: parseFloat(bc.montoPreestablecido) });
          this.dibujarTablaItems(); selC.value = ''; this.guardarBorrador();
        });
        ig.appendChild(selC); ig.appendChild(btnA); colC.appendChild(lC); colC.appendChild(ig); row1.appendChild(colC);
        body.appendChild(row1); this.divT = Utils.crearElemento('div'); body.appendChild(this.divT);

        const dBtn = Utils.crearElemento('div', { class: 'text-end mt-4' });
        const bSig = Utils.crearElemento('button', { class: 'btn btn-success btn-lg' }); bSig.textContent = 'Ver Resumen y Distribuir →';
        bSig.addEventListener('click', async () => { 
            if (this.seleccionados.length === 0) return alert('Agregue conceptos.'); 
            await this.guardarBorrador();

      async procesar(contenedor, neto) {
        if(neto <= 0) return alert('Neto no mayor a 0'); if(!confirm('¿Cargar montos a deudas?')) return;
        Utils.mostrarCargando(contenedor);
        try {
          await SecureDoc.data.add({ mesAnio: this.mes, balance: neto, tipoDato: 'presupuesto_historico' }); 
          const fHoy = Utils.obtenerFechaHoyISO();
          for (const a of this.aptos) {
            const m = neto * (Number(a.alicuota)/100);
            if (m > 0) {
              await SecureDoc.data.add({
                apartamento: a.numero, fecha: fHoy, tipo: 'Cargo por Presupuesto',
                monedaOriginal: 'USD', tasaCambio: 1, montoUSD: m, observacion: `Presupuesto ${this.mes}`
              });
              const nd = (parseFloat(a.deudaActual)||0) + m; await SecureDoc.data.update(a.id, { deudaActual: nd });
            }
          }
          
          // Limpiar borrador tras procesar
          this.seleccionados = [];
          await this.guardarBorrador();

          alert('¡Procesado exitosamente!'); this.render(contenedor);
        } catch(e) { console.error(e); Utils.mostrarError(contenedor, "Error al procesar. Revise datos."); }

            const d1 = Utils.crearElemento('td', { class: 'align-middle fw-bold fs-5' }); d1.textContent = a.numero;
            const d2 = Utils.crearElemento('td', { class: 'text-start align-middle' }); d2.textContent = a.propietario;
            
            const d3 = Utils.crearElemento('td', { class: 'align-middle fs-5' });
            const d = Number(a.deudaActual)||0;
            if (d > 0) {
               d3.textContent = `$${d.toFixed(2)}`; d3.classList.add('deuda-alta'); tDeuda += d; nMor++;
            } else if (d < 0) {
               d3.textContent = `A favor $${Math.abs(d).toFixed(2)}`; d3.classList.add('text-success');
            } else {
               d3.textContent = 'SOLVENTE'; d3.classList.add('text-success', 'fw-bold', 'small');
            }
            tr.appendChild(d1); tr.appendChild(d2); tr.appendChild(d3); tbo.appendChild(tr);
          });
          tb.appendChild(tbo);

          if (aptos.length > 0) {
            const tfo = Utils.crearElemento('tfoot', { class: 'table-light fw-bold' });
            const trf = Utils.crearElemento('tr');
            const tf1 = Utils.crearElemento('td', { colspan: '2', class: 'text-end py-3 fs-5' }); tf1.textContent = 'DEUDA TOTAL POR COBRAR:';
            const tf2 = Utils.crearElemento('td', { class: 'py-3 fs-5' }); tf2.textContent = `$${tDeuda.toFixed(2)}`;
            trf.appendChild(tf1); trf.appendChild(tf2); tfo.appendChild(trf); tb.appendChild(tfo);
          }
          pCon.appendChild(tb);

          const ftr = Utils.crearElemento('div', { class: 'mt-3 d-flex justify-content-between text-muted small' });
          const sl = Utils.crearElemento('span'); sl.textContent = `Morosos: ${nMor} / ${aptos.length}`;
          const sr = Utils.crearElemento('span'); sr.textContent = 'Pagos Bs. calculados a tasa BCV fecha pago.';
          ftr.appendChild(sl); ftr.appendChild(sr); pCon.appendChild(ftr);
          contenedor.appendChild(pCon);
        } catch(e) { console.error(e); Utils.mostrarError(contenedor, 'Error generando reporte.'); }
      }
    };

    // --- MAIN ---
    SecureDoc.ready(async (context) => {
      console.log('SecureDoc Listo. App:', context.app);
      const contenedor = document.getElementById('app-container');
      
      try {
        const perfil = await Utils.cargarPerfil();
        const bText = document.getElementById('brand-text');
        if (perfil && perfil.nombreCondominio) {
            bText.textContent = perfil.nombreCondominio;
        }
      } catch (e) {
        console.error('Error al cargar perfil inicial:', e);
      }

      try {
        const tHoy = await Utils.consultarTasaBCV(Utils.obtenerFechaHoyISO());
        document.getElementById('tasa-del-dia').textContent = `Tasa BCV hoy: ${tHoy.toFixed(2)}`;
      } catch (e) {
        document.getElementById('tasa-del-dia').textContent = `Tasa BCV: N/D`;
      }

      const navLinks = {
        'nav-brand': Dashboard, 'nav-dashboard': Dashboard, 'nav-directorio': Directorio,
        'nav-conceptos': Conceptos, 'nav-presupuestos': Presupuestos, 'nav-cargos': CargosEspeciales,
        'nav-caja': Caja, 'nav-reportes': Reportes, 'nav-perfil': Perfil
      };

      const setActive = (id) => {
        document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active', 'fw-bold'));
        const el = document.getElementById(id);
        if(el && el.classList.contains('nav-link')) el.classList.add('active', 'fw-bold');
      };

      Object.keys(navLinks).forEach(id => {
        const el = document.getElementById(id);
        if (el) {
          el.addEventListener('click', (e) => {
             e.preventDefault(); setActive(id); navLinks[id].render(contenedor);
             const navbarToggler = document.querySelector('.navbar-toggler');
             const navbarCollapse = document.querySelector('.navbar-collapse');
             if(window.getComputedStyle(navbarToggler).display !== 'none' && navbarCollapse.classList.contains('show')){
                navbarToggler.click();
             }
          });
        }
      });

      setActive('nav-dashboard'); Dashboard.render(contenedor);
    });

  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
